version: '3.9'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root4rodas
      MYSQL_DATABASE: 4rodas
      MYSQL_USER: api_user
      MYSQL_PASSWORD: api_pass_2024
    command: >
      --character-set-server=latin1
      --collation-server=latin1_swedish_ci
      --default-authentication-plugin=mysql_native_password
      --skip-log-bin
      --sql-mode=NO_ENGINE_SUBSTITUTION
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot4rodas"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  api:
    build: ./backend
    ports:
      - "3001:3000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: api_user
      DB_PASSWORD: api_pass_2024
      DB_NAME: 4rodas
      PORT: "3000"
      SUPERVISOR_PIN: "1234"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    environment:
      API_URL: http://api:3000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mysql_data:
